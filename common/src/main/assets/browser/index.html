<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TesAir</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:#080a0c;color:#f2f3f5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit;border-radius:24px;padding:12px 24px;min-height:48px;background:#23262a;border:1px solid #3b3e43;color:#f2f3f5;font-weight:500;cursor:pointer}button:disabled{opacity:.5}button:focus-visible{outline:2px solid white;outline-offset:4px}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;object-fit:fill;touch-action:none}#panel{position:absolute;top:50%;transform:translateY(-50%);padding:28px 20px;max-width:440px;width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;text-align:center}#activity{width:28px;height:28px;margin:0 auto 24px;border:2px solid #ffffff1a;border-top-color:#c5c8cd;border-radius:50%;animation:spin 1s linear infinite}h1{font-size:24px;font-weight:500;letter-spacing:-.5px;line-height:1.3;margin:0}p{margin:10px 0 0;color:#a5a9b0;font-size:15px;line-height:1.5}#error{color:#c6c9ce}#retry{margin-top:24px}[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#activity{animation:none}}@media(max-height:360px){#panel{padding:12px 16px}#activity{margin-bottom:16px}h1{font-size:22px}#retry{margin-top:16px}}
</style>
<main id="stage"><canvas id="screen" aria-label="TesAir browser display. Tap or swipe to control CarPlay."></canvas>
<section id="panel" aria-labelledby="heading"><div id="activity" aria-hidden="true"></div><h1 id="heading" role="status" aria-live="polite">Connecting…</h1><p id="intro">Your display will appear automatically.</p><p id="status" hidden></p><p id="error" role="alert" hidden></p><button id="retry" type="button" hidden>Try again</button></section></main>
<script src="/telemetry.js"></script>
<script src="/player.js"></script>
</html>
